- id: REQ-TOOL-SEARCH-EVIDENCE
  prd_section: "60"
  prd_anchor: "tool search_evidence (AI tool contracts)"
  statement: >
    Tool `search_evidence` (AI tool contracts) implements its §60 contract exactly: -
    Purpose: Retrieve evidence relevant to a query within the current investigation. -
    Inputs: `query: string`, `mode: 'hybrid'|'keyword'|'semantic'|'exact'`, `filters:
    {doc_types?, date_range?, entities?, sources?, epistemic_states?}`, `limit: int ≤ 50` -
    Outputs: `{ evidence_units: [{id, text, locator, source_ref, source_assessment,
    epistemic_state, score, explanation}], coverage: {...} }` - Permissions: Inherits the
    invoking user's read permissions; results pre-filtered. - Side effects: Writes a
    `searches` row for reproducibility. - Confirmation: None. - Audit: `SearchExecuted` with
    `actor_type: ai`, `on_behalf_of: user`. - Failure: Returns empty set with a coverage
    report explaining why. Never fabricates. Index unavailable → explicit error surfaced to
    the user, not silent empty results. ---
  type: tool
  epic: E8
  priority: must
  verification:
    method: [unit_test, integration_test, arch_test]
    artifacts:
      - apps/api/test/ai-stories.integration.test.ts
      - apps/api/test/ai-acceptance.integration.test.ts
