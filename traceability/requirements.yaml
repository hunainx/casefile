- id: REQ-SRCQ-001
  prd_section: "20.1"
  prd_anchor: "Why not a credibility score"
  statement: >
    A single 0–100 credibility number is worse than useless in investigative work, for three
    reasons: credibility is proposition-specific (a company's own filing is authoritative
    about its registered address and self-serving about its financial health); it is
    dimension-specific (a source can be highly reliable and entirely non-independent); and a
    scalar invites automation of a judgment that must remain human.
