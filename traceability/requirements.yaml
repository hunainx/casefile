  prd_section: "56.1"
  prd_anchor: "AC-DEF-03 — Question materiality drives closure"
  statement: >
    - Given an investigation with one `critical` question in state `open` - When the user
    attempts to transition to `concluding` - Then the transition is blocked until the
    question has a finding or is marked `unanswerable` with a rationale
  type: acceptance
  epic: E2
  priority: must
