  prd_section: "56.1"
  prd_anchor: "AC-DEF-02 — Legitimacy requirement"
  statement: >
    - Given a user adds a subject of type `private_individual` - When they save the subject
    without a `legitimacy_basis` - Then the save is rejected; and when they save with a
    basis, a `LegitimacyDeclared` audit event is written and the workspace admin is notified
  type: acceptance
  epic: E2
  priority: must
  verification:
