- id: REQ-M-SEC-017
  prd_section: "40"
  prd_anchor: No hardcoded authentication or authorization secret
  statement: >
    No authentication or authorization secret (JWT signing key, MCP token, database
    connection string, API key, password, credential) may have a hardcoded default value
    in source. A missing secret must fail loudly, never fall back to a literal.
  type: security
  epic: E1
  priority: must
  verification:
    method:
      - arch_test
    artifacts:
      - guardrails/secret-hygiene.spec.ts
  status: not_started
  verified_at: null
  notes: "Added 2026-09-04 (Fix 7). Until then apps/api/src/auth/crypto.ts fell back to a public literal JWT secret and packages/db/src/client.ts to a literal connection string."

- id: REQ-M-SEC-018
  prd_section: "40"
  prd_anchor: Runtime refuses to start without required secrets
  statement: >
    The API must refuse to start when any required runtime secret (DATABASE_URL,
    SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, JWT_SECRET) is unset, exiting
    non-zero and naming every missing variable, before it listens for requests.
  type: security
  epic: E1
  priority: must
  verification:
    method:
      - arch_test
    artifacts:
      - guardrails/secret-hygiene.spec.ts
      - apps/api/src/config/required-secrets.ts
  status: not_started
  verified_at: null
  notes: "Added 2026-09-04 (Fix 7). Boot gate is assertRequiredRuntimeSecrets() called in apps/api/src/server.ts, the Cloud Run entry point."

- id: REQ-M-SEC-019
  prd_section: "40"
  prd_anchor: Required runtime secrets provisioned and mounted per matter
  statement: >
    Every required runtime secret must be provisioned per matter in Secret Manager and
    mounted on that matter's Cloud Run service by scripts/deploy-matter.ts; the set the
    deploy mounts must equal the set the API requires to boot.
  type: security
  epic: E1
  priority: must
  verification:
    method:
      - arch_test
    artifacts:
      - guardrails/secret-hygiene.spec.ts
      - scripts/deploy-matter.ts
  status: not_started
  verified_at: null
  notes: "Added 2026-09-04 (Fix 7). JWT_SECRET was absent from the deploy's --set-secrets for the entire life of the file; see DEV-018 for secrets that are still names only."
